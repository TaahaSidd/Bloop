# Server Configuration
server.port=8080
server.address=0.0.0.0

# PostgreSQL Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/SpicaLabs
spring.datasource.username=taaha
spring.datasource.password=SpicaLabs
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
# Automatically creates or updates missing tables without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SQL Logging (Helpful during development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

